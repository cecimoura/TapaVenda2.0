name: Landing pages

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test both variants and local assets
        run: python -m unittest discover -s tests -v
      - name: Build static sites
        run: python scripts/build.py
      - name: Test container and both routes
        run: |
          docker build -t tapa-landing-test .
          docker run -d --name tapa-landing-test -p 127.0.0.1:18088:80 tapa-landing-test
          trap 'docker rm -f tapa-landing-test' EXIT
          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:18088/com-valor/ -o /tmp/tapa-com-valor.html
          curl --fail --silent --show-error \
            http://127.0.0.1:18088/sem-valor/ -o /tmp/tapa-sem-valor.html
          curl --fail --silent --show-error \
            http://127.0.0.1:18088/sem-valor/style.css -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:18088/healthz
          test "$(curl --silent --output /dev/null --write-out '%{redirect_url}' http://127.0.0.1:18088/)" = \
            'http://127.0.0.1:18088/sem-valor/'
          grep -q 'R\$ 3.500' /tmp/tapa-com-valor.html
          ! grep -q 'R\$' /tmp/tapa-sem-valor.html
          grep -q 'wa.me/5545999259973' /tmp/tapa-sem-valor.html
      - uses: actions/upload-artifact@v4
        with:
          name: tapa-landing-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-image:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: tapa-landing-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cecimoura/tapavenda2.0:latest
            ghcr.io/cecimoura/tapavenda2.0:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/cecimoura/TapaVenda2.0
      - name: Ask Portainer to update the Git stack
        if: vars.PORTAINER_ENABLED == 'true'
        env:
          PORTAINER_GITOPS_WEBHOOK: ${{ secrets.PORTAINER_GITOPS_WEBHOOK }}
        run: |
          test -n "$PORTAINER_GITOPS_WEBHOOK"
          curl --fail-with-body --silent --show-error --retry 3 \
            --max-time 30 --request POST "$PORTAINER_GITOPS_WEBHOOK"
