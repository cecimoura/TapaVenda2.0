name: Landing pages

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test both variants and local assets
        run: python -m unittest discover -s tests -v
      - name: Build static sites
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: tapa-landing-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: tapa-landing-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tapa-landing-${{ github.sha }}
          path: dist/
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
        run: |
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_ROOT"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Publish both paths
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_ROOT/com-valor' '$DEPLOY_ROOT/sem-valor'"
          rsync -az --delete --delay-updates -e 'ssh -o StrictHostKeyChecking=yes' \
            dist/com-valor/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/com-valor/"
          rsync -az --delete --delay-updates -e 'ssh -o StrictHostKeyChecking=yes' \
            dist/sem-valor/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/sem-valor/"
